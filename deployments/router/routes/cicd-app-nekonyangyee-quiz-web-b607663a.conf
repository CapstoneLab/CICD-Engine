location = /services/NekoNyangYee/quiz-web { return 301 /services/NekoNyangYee/quiz-web/; }
location ^~ /services/NekoNyangYee/quiz-web/ {
  set $cicd_upstream cicd-app-nekonyangyee-quiz-web-b607663a:80;
  rewrite ^/services/NekoNyangYee/quiz\-web/(.*)$ /$1 break;
  proxy_pass http://$cicd_upstream;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $cicd_connection_upgrade;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $cicd_real_ip;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $cicd_forwarded_host;
  proxy_set_header X-Forwarded-Proto $cicd_forwarded_proto;
  proxy_set_header X-Forwarded-Port $cicd_forwarded_port;
  proxy_set_header X-Forwarded-Prefix /services/NekoNyangYee/quiz-web;
  add_header X-CICD-Service nekonyangyee/quiz-web always;
}
