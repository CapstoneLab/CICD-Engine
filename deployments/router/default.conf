map $http_upgrade $cicd_connection_upgrade { default upgrade; '' close; }
map $http_x_real_ip $cicd_real_ip { default $http_x_real_ip; '' $remote_addr; }
map $http_x_forwarded_host $cicd_forwarded_host { default $http_x_forwarded_host; '' $http_host; }
map $http_x_forwarded_proto $cicd_forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }
map $http_x_forwarded_port $cicd_forwarded_port { default $http_x_forwarded_port; '' $server_port; }
server {
  listen 80 default_server;
  server_name _;
  absolute_redirect off;
  resolver 127.0.0.11 ipv6=off valid=10s;
  client_max_body_size 50m;
  location = /_cicd/health { default_type application/json; return 200 '{"status":"ok"}'; }
  include /etc/nginx/routes/*.conf;
  location / { return 404; }
}
