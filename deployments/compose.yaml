name: capstone-deployments
services:
  router:
    image: nginx:1.27-alpine
    container_name: capstone-deploy-router
    restart: unless-stopped
    ports:
    - 127.0.0.1:19080:80
    volumes:
    - type: bind
      source: /home/capstone/CICD-Engine/deployments/router/default.conf
      target: /etc/nginx/conf.d/default.conf
      read_only: true
    - type: bind
      source: /home/capstone/CICD-Engine/deployments/router/routes
      target: /etc/nginx/routes
      read_only: true
    networks:
    - internal
  cicd-app-nekonyangyee-samplejavascript4-c01d5263:
    image: cicd-managed/nekonyangyee-samplejavascript4:9ac71704f87a
    container_name: cicd-app-nekonyangyee-samplejavascript4-c01d5263
    restart: unless-stopped
    environment:
      PORT: '3000'
      HOST: 0.0.0.0
      HOSTNAME: 0.0.0.0
    ports:
    - 127.0.0.1:17397:3000
    labels:
      com.capstonelab.cicd.managed: 'true'
      com.capstonelab.cicd.service-key: nekonyangyee/samplejavascript4
